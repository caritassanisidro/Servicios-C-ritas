    <style>
        :root { --azul: #135189; --rojo: #ae3336; --gris: #696b6d; --fondo: #f8f9fa; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--fondo); margin: 0; padding: 0; color: #333; }
        .container { max-width: 500px; margin: 0 auto; padding: 20px; text-align: center; }
        .logo { width: 160px; margin-bottom: 10px; }
        h1 { color: var(--azul); font-size: 1.4rem; margin-bottom: 5px; }
        .description { color: var(--gris); font-size: 0.9rem; margin-bottom: 25px; padding: 0 10px; }
        .zone-menu { display: flex; flex-direction: column; gap: 12px; }
        .btn-zone { background-color: var(--azul); color: white; padding: 16px; border-radius: 12px; border: none; font-weight: bold; font-size: 1rem; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn-back { background-color: var(--gris); color: white; padding: 8px 15px; border-radius: 8px; border: none; margin-bottom: 20px; cursor: pointer; }
        .parish-card { background: white; border-radius: 15px; padding: 18px; margin-bottom: 15px; text-align: left; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border-left: 5px solid var(--rojo); }
        .parish-card h3 { color: var(--azul); margin: 0 0 10px 0; font-size: 1.1rem; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .info-item { margin: 8px 0; font-size: 0.85rem; line-height: 1.3; }
        .info-label { font-weight: bold; color: var(--rojo); display: block; margin-bottom: 2px; }
        .badge-container { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
        .badge { background: #eef2f7; color: var(--azul); padding: 2px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; }
        .social { margin-top: 30px; display: flex; justify-content: center; gap: 20px; }
        .social a { color: var(--azul); font-size: 1.8rem; }
        .hidden { display: none; }
    </style>
</head>

    <p class="description">Información de servicios, horarios y contacto de las Cáritas parroquiales de la Diócesis de San Isidro.</p>
    <div class="zone-menu">

        <button class="btn-zone" onclick="showZone('San Isidro')">San Isidro</button>
        <button class="btn-zone" onclick="showZone('San Fernando')">San Fernando</button>
        <button class="btn-zone" onclick="showZone('Tigre')">Tigre</button>
    </div>
    <div class="social">

        <a href="https://caritassanisidro.org.ar/" target="_blank"><i class="fa-solid fa-globe"></i></a>
    </div>
</div>

    function showZone(zoneName) {
        document.getElementById('home-screen').classList.add('hidden');
        document.getElementById('zone-screen').classList.remove('hidden');
        document.getElementById('zone-title').innerText = zoneName;
        const listDiv = document.getElementById('parish-list');
        listDiv.innerHTML = '';
        const filtered = data.filter(p => p.zona === zoneName);
        filtered.forEach(p => {
            const card = document.createElement('div');
            card.className = 'parish-card';
            card.innerHTML = `
                <h3>${p.parroquia}</h3>
                <div class="info-item"><span class="info-label">Servicios:</span><div class="badge-container">${p.servicios.split(',').map(s => `<span class="badge">${s.trim()}</span>`).join('')}</div></div>
                <div class="info-item"><span class="info-label"><i class="fa-solid fa-clock"></i> Horarios:</span>${p.horarios}</div>
                <div class="info-item"><span class="info-label"><i class="fa-solid fa-person-cane"></i> Mayores:</span>${p.mayores}</div>
                <div class="info-item"><span class="info-label"><i class="fa-solid fa-person-shelter"></i> Calle:</span>${p.calle}</div>
                <div class="info-item"><span class="info-label"><i class="fa-solid fa-phone"></i> Contacto:</span>${p.contacto}</div>
            `;
            listDiv.appendChild(card);
        });
        window.scrollTo(0,0);
    }
    function goHome() {
        document.getElementById('home-screen').classList.remove('hidden');
        document.getElementById('zone-screen').classList.add('hidden');
    }

</html>
