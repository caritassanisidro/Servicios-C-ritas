.container { max-width:500px; margin:0 auto; padding:20px; text-align:center; }

.zone-menu { display:flex; flex-direction:column; gap:12px; }
.btn-zone { background-color:var(--azul); color:white; padding:16px; border-radius:12px; border:none; font-weight:bold; font-size:1rem; cursor:pointer; box-shadow:0 4px 6px rgba(0,0,0,.1); }
.search-container { position:sticky; top:10px; z-index:100; background:white; padding:10px; border-radius:12px; box-shadow:0 4px 10px rgba(0,0,0,.1); margin-bottom:20px; display:flex; align-items:center; gap:10px; }
.search-input { border:none; width:100%; outline:none; font-size:1rem; }
.filter-info { font-size:.8rem; color:var(--rojo); margin-bottom:10px; font-weight:bold; display:none; cursor:pointer; text-decoration:underline; }
.btn-back { background-color:var(--gris); color:white; padding:8px 15px; border-radius:8px; border:none; margin-bottom:20px; cursor:pointer; }
.parish-card { background:white; border-radius:15px; padding:18px; margin-bottom:15px; text-align:left; box-shadow:0 2px 8px rgba(0,0,0,.06); border-left:5px solid var(--rojo); }
.parish-card h3 { color:var(--azul); margin:0 0 10px 0; font-size:1.1rem; border-bottom:1px solid #eee; padding-bottom:5px; }
.info-item { margin:12px 0; font-size:.9rem; line-height:1.4; }
.info-label { font-weight:bold; color:var(--rojo); display:block; margin-bottom:4px; }
.badge-container { display:flex; flex-wrap:wrap; gap:6px; margin-top:5px; }
.badge { background:#eef2f7; color:var(--azul); padding:5px 12px; border-radius:8px; font-size:.75rem; font-weight:bold; border:1px solid #d0dbe5; cursor:pointer; }
.badge.active { background:var(--rojo); color:white; border-color:var(--rojo); }
.contact-container { display:flex; flex-wrap:wrap; gap:8px; margin-top:5px; }
.contact-link { display:inline-flex; align-items:center; gap:6px; background:#f0f7ff; color:var(--azul); padding:8px 12px; border-radius:8px; text-decoration:none; font-weight:bold; font-size:.85rem; border:1px solid #cce0f5; }
.contact-link i { font-size:1rem; }
.contact-link.wa { color:#25d366; background:#e8f9ee; border-color:#c7e9d2; }
.details-btn { background:#eef2f7; color:var(--azul); border:1px dashed var(--azul); padding:8px 12px; border-radius:8px; font-size:.8rem; font-weight:bold; cursor:pointer; width:100%; margin-top:10px; display:flex; justify-content:space-between; align-items:center; }
.details-content { display:none; margin-top:10px; background:#fafafa; padding:10px 14px; border-radius:8px; border:1px solid #eee; font-size:.85rem; }
.details-content ul { margin:0; padding-left:18px; }
.details-content li { margin-bottom:5px; color:#444; }
.social { margin-top:30px; display:flex; justify-content:center; gap:30px; }
.social a { color:var(--azul); font-size:2.2rem; text-decoration:none; }
.hidden { display:none; }

function showZone(zoneName) {

function showZone(zoneName) {
    currentZone=zoneName;
    selectedService=null;
    document.getElementById('searchInput').value="";
    document.getElementById('home-screen').classList.add('hidden');
    document.getElementById('zone-screen').classList.remove('hidden');
    document.getElementById('zone-title').innerText="Zona: "+zoneName;
    applyFilters();
}

function applyFilters() {
    const searchTerm=document.getElementById('searchInput').value.toLowerCase();
    const listDiv=document.getElementById('parish-list');
    listDiv.innerHTML='';

    const filtered=data.filter(p=>{
        const matchesZone=p.zona===currentZone;
        const matchesSearch=p.parroquia.toLowerCase().includes(searchTerm);
        const matchesService=selectedService ? p.servicios.includes(selectedService) : true;
        return matchesZone && matchesSearch && matchesService;
    });

    filtered.forEach((p,idx)=>{
        const card=document.createElement('div');
        card.className='parish-card';

        const horariosNoEspecificos=[
            "según secretaría","segun secretaria",
            "sin horario fijo",
            "según necesidad","segun necesidad"
        ];

        let horarioHTML="";
        if (p.horarios && !horariosNoEspecificos.includes(p.horarios.trim().toLowerCase())) {
            horarioHTML=`<div class="info-item"><span class="info-label"><i class="fa-solid fa-clock"></i> Horarios:</span>${p.horarios}</div>`;
        }

        let detailsHTML='';
        if (p.detalles && p.detalles.length>0) {
            const detailsList=p.detalles.map(d=>`<li>${d}</li>`).join('');
            detailsHTML=`
                <button class="details-btn" onclick="toggleDetails(${idx})">
                    <span><i class="fa-solid fa-calendar-days"></i> Ver desglose de días y actividades</span>
                    <i class="fa-solid fa-chevron-down" id="chevron-${idx}"></i>
                </button>
                <div class="details-content" id="details-${idx}"><ul>${detailsList}</ul></div>`;
        }

        let contactHTML="";
        if (p.contacto && p.contacto.trim() && !["no","no hay","no tenemos"].includes(p.contacto.trim().toLowerCase())) {
            contactHTML=`
                <div class="info-item" style="margin-top:15px;">
                    <span class="info-label"><i class="fa-solid fa-address-book"></i> Contacto:</span>
                    <div class="contact-container">${renderContactLinks(p.contacto)}</div>
                </div>`;
        }

        card.innerHTML=`
            <h3>${p.parroquia}</h3>
            <div class="info-item">
                <span class="info-label">Servicios: (Toca uno para filtrar)</span>
                <div class="badge-container">${p.servicios.split(',').map(s=>{
                    const sClean=s.trim();
                    return `<span class="badge ${selectedService===sClean?'active':''}" onclick="setServiceFilter('${sClean.replace(/'/g,"\\'")}')">${sClean}</span>`;
                }).join('')}</div>
            </div>
            ${horarioHTML}
            ${detailsHTML}
            ${contactHTML}`;
        listDiv.appendChild(card);
    });
}

function toggleDetails(index) {
    const detailsEl=document.getElementById(`details-${index}`);
    const chevronEl=document.getElementById(`chevron-${index}`);
    if (detailsEl.style.display==="block") {
        detailsEl.style.display="none";
        chevronEl.className="fa-solid fa-chevron-down";
    } else {
        detailsEl.style.display="block";
        chevronEl.className="fa-solid fa-chevron-up";
    }
}

function renderContactLinks(contactoStr) {
    if (!contactoStr) return "";
    const numbers=contactoStr.split(/[,;]/);
    return numbers.map(num=>{
        const cleanNum=num.trim().replace(/[^0-9+]/g,'');
        if (!cleanNum) return "";
        const digits=cleanNum.replace(/\D/g,'');
        const isMobile=digits.length>=10 && (digits.startsWith("11") || digits.startsWith("15") || digits.startsWith("549"));
        if (isMobile) {
            let waNum=digits;
            if (waNum.startsWith("0")) waNum=waNum.substring(1);
            if (waNum.startsWith("15")) waNum="11"+waNum.substring(2);
            if (!waNum.startsWith("549")) waNum="549"+waNum;
            return `<a href="https://wa.me/${waNum}" class="contact-link wa" target="_blank"><i class="fa-brands fa-whatsapp"></i> WhatsApp (${cleanNum})</a>`;
        }
        return `<a href="tel:${cleanNum}" class="contact-link"><i class="fa-solid fa-phone"></i> Llamar (${cleanNum})</a>`;
    }).join(' ');
}

function setServiceFilter(service) {
    selectedService=(selectedService===service)?null:service;
    document.getElementById('filterIndicator').style.display=selectedService?"block":"none";
    document.getElementById('activeFilterName').innerText=selectedService||"";
    applyFilters();
}

function clearServiceFilter() {
    selectedService=null;
    document.getElementById('filterIndicator').style.display="none";
    applyFilters();
}

function goHome() {
    document.getElementById('home-screen').classList.remove('hidden');
    document.getElementById('zone-screen').classList.add('hidden');
}
